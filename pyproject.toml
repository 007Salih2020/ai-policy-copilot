[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc2-copilot"
version = "0.1.0"
description = "Grounded SOC 2 policy copilot for Azure DevOps evidence discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "typer>=0.12.3,<1.0.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115.0,<1.0.0",
  "streamlit>=1.39.0,<2.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
soc2-copilot = "soc2_copilot.cli.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
